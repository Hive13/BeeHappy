name: bhapi

services:

  postgresql:
    image: postgres:16-trixie
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - bhapi-net
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-backups:/dbdump
    configs:
      - source: pg-bhapi-init
        target: /docker-entrypoint-initdb.d/00-bhapi-init.sh
    secrets:
      - pg-password
      - pg-bhapi-password
  
  valkey:
    image: valkey/valkey:7.2
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - bhapi-net
    expose:
      - "6379"
    

  app:
    build:
      context: .
      dockerfile: ./buildspec/app/Dockerfile
    depends_on: 
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped
    env_file:
      - ./env/bhapi-default.env
      - path: ./env/bhapi-override.env
        required: false
    expose:
      - "5001"
    networks:
      - bhapi-net
    secrets:
      - source: bhapi-config
        target: bhapi_config.py

  web:
    image: nginx:alpine-slim
    depends_on:
      - app
    networks:
      - bhapi-net
    ports:
      - "8050:80"
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf

networks:
  bhapi-net:

volumes:
  # PostgreSQL data
  pg-data:
  # PostgreSQL backups
  pg-backups:
  # Valkey (Redis) data
  valkey-data:

configs:
  nginx:
    file: ./configs/nginx/nginx.conf
  pg-bhapi-init:
    file: ./configs/postgres/00-bhapi-init.sh

secrets:
  pg-password:
    file: ./secrets/pg-password
  pg-bhapi-password:
    file: ./secrets/pg-bhapi-password
  bhapi-config:
    file: ./secrets/bhapi_config.py
