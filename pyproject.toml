[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bhapi"
dynamic = ["version"]
dependencies = [
  "Flask==3.1.3",
  "Flask-Session[redis]==0.8.0",
  "flask-oidc==2.4.0",
  "requests==2.34.2",
  "python-dotenv==1.2.4",
  "psycopg[binary,pool]==3.3.6",
  "SQLAlchemy==2.1.6",
  "Flask-SQLAlchemy==3.1.1",
  "alembic==1.20.1",
  "Flask-Migrate==4.1.0",
  "gunicorn==26.2.0",
  "Markdown==3.11.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "bhapi.app_meta.app_version"}

[tool.setuptools.packages.find]
where = ["src"]